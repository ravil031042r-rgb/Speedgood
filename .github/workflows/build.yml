name: Build SpeedGod APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install NDK and CMake
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias speedgod -storepass speedgod123 -keypass speedgod123 -dname "CN=SpeedGod, O=SpeedGod, C=US"
      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: speedgod123
          RELEASE_KEY_ALIAS: speedgod
          RELEASE_KEY_PASSWORD: speedgod123
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SpeedGod-v1.0-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedGod-APK
          path: app/build/outputs/apk/release/SpeedGod-v1.0-release.apk
